# Tiny Tapeout project information
project:
  title:        "Simple MAC Engine w/ Postproc"      # Project title
  author:       "Luca Goddijn"      # Your name
  discord:      "swagg3rballs"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Quantized INT8 MAC engine with bias, activation, and quantizer postproc, SPI-controlled"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable) -- 40ns period

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_arty3_mac_engine"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "pipeline_reg.sv"
    - "bias_add.sv"
    - "activation.sv"
    - "quantize.sv"
    - "postproc.sv"
    - "conv_pe.sv"
    - "spi_slave.sv"
    - "regfile.sv"
    - "cmd_fsm.sv"
    - "tt_um_arty3_mac_engine.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "unused"
  ui[1]: "unused"
  ui[2]: "unused"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "unused"
  ui[6]: "unused"
  ui[7]: "unused"

  # Outputs
  uo[0]: "STATUS.IDLE"
  uo[1]: "STATUS.BUSY"
  uo[2]: "STATUS.RESULT_VALID"
  uo[3]: "STATUS.ACC_OVF_STK"
  uo[4]: "FSM state[0]"
  uo[5]: "FSM state[1]"
  uo[6]: "FSM state[2]"
  uo[7]: "heartbeat (clk/2^20)"

  # Bidirectional pins
  uio[0]: "SPI_CS_N (in)"
  uio[1]: "SPI_SCLK (in)"
  uio[2]: "SPI_MOSI (in)"
  uio[3]: "SPI_MISO (out)"
  uio[4]: "reserved (in)"
  uio[5]: "reserved (in)"
  uio[6]: "reserved (in)"
  uio[7]: "reserved (in)"

# Do not change!
yaml_version: 6
