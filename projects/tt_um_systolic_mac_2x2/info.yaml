# Tiny Tapeout project information
project:
  title:        "2x2 Systolic Array Matrix Multiplier"
  author:       "Irene-ux"
  discord:      ""
  description:  "2x2 output-stationary systolic array for signed 4-bit matrix multiply on GF180"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "1x1"
  top_module:  "tt_um_systolic_mac_2x2"
  source_files:
      - "PE_module.v"
      - "array_module.v"
      - "FSM_module.v"
      - "output_serializer.v"
      - "systolic_array.v"
      - "tt_um_systolic_mac_2x2.v"
pinout:
  ui[0]: "start"
  ui[1]: "load"
  ui[2]: "sel[0]"
  ui[3]: "sel[1]"
  ui[4]: "data_c1[0]"
  ui[5]: "data_c1[1]"
  ui[6]: "data_c1[2]"
  ui[7]: "data_c1[3]"
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"
  uio[0]: "valid"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: "data_c2[0]"
  uio[5]: "data_c2[1]"
  uio[6]: "data_c2[2]"
  uio[7]: "data_c2[3]"
