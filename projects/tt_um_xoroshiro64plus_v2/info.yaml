# Tiny Tapeout project information
project:
  title:        "xoroshiro64"      # Project title
  author:       "Vivek Chiranjit"      # Your name
  discord:      "cj_pat"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "xoroshiro TRNG"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_xoroshiro64plus_v2"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_xoroshiro64plus_v2.v"
    - "xoroshiro64p.v"
    - "ring_osc.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "seed data"
  ui[1]: "seed data"
  ui[2]: "seed data"
  ui[3]: "seed data"
  ui[4]: "seed data"
  ui[5]: "seed data"
  ui[6]: "seed data"
  ui[7]: "seed data"

  # Outputs
  uo[0]: "serial_out_w"
  uo[1]: "valid_out_w"
  uo[2]: "osc_ro_fast"
  uo[3]: "osc_ro_slow"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "seed_sel"
  uio[1]: "seed_sel"
  uio[2]: "seed_sel"
  uio[3]: "seed_wen"
  uio[4]: "enable"
  uio[5]: "ro_noise"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
