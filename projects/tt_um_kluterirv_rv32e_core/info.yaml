# Tiny Tapeout project information
project:
  title:        "Minimal RV32E SoC with UART Loader"      # Project title
  author:       "Kris / KLuterIRV"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Minimal RV32E microcontroller with UART program loader, internal instruction memory, GPIO and configurable 7-segment output"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     20000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "4x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kluterirv_rv32e_core"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
  - "top/tt_um_kluterirv_rv32e_core.v"
  - "core/irv_core.v"
  - "core/irv_regfile.v"
  - "core/irv_alu.v"
  - "core/irv_decoder.v"
  - "core/irv_fetch.v"
  - "core/irv_pc_ctrl.v"
  - "soc/irv_peripheral_bus.v"
  - "mem/sram128x16.v"
  - "peripherals/gpio0.v"
  - "peripherals/uart0.v"
  - "peripherals/i2c0.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "sram_we"
  ui[1]: "sram_addr[0]"
  ui[2]: "sram_wdata[0]"
  ui[3]: "sram_wdata[1]"
  ui[4]: "sram_wdata[2]"
  ui[5]: "sram_wdata[3]"
  ui[6]: "sram_wdata[4]"
  ui[7]: "sram_wdata[5]"

  # Outputs
  uo[0]: "sram_rdata[0]"
  uo[1]: "sram_rdata[1]"
  uo[2]: "sram_rdata[2]"
  uo[3]: "sram_rdata[3]"
  uo[4]: "sram_rdata[4]"
  uo[5]: "sram_rdata[5]"
  uo[6]: "sram_rdata[6]"
  uo[7]: "sram_rdata[7]"

  # Bidirectional pins
  uio[0]: "sram_wdata[6]"
  uio[1]: "sram_wdata[7]"
  uio[2]: "sram_addr[1]"
  uio[3]: "sram_addr[2]"
  uio[4]: "sram_addr[3]"
  uio[5]: "sram_addr[4]"
  uio[6]: "sram_addr[5]"
  uio[7]: ""

# Do not change!
yaml_version: 6
