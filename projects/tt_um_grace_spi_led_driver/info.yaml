# Tiny Tapeout project information
project:
  title:        "SPI-Controlled 8-Channel LED Driver"      # Project title
  author:       "Grace Eysenbach"      # Your name
  discord:      "geysenbach"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "SPI peripheral with addressable 8-bit registers for controlling 8x LEDs"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_grace_spi_led_driver"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "tt_um_grace_spi_led_driver.sv"
    - "synchronizer.sv"
    - "spi_peripheral.sv"
    - "register_file.sv"
    - "falling_edge_detector.sv"
    - "rising_edge_detector.sv"
    - "reclocking.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: ""
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "LED0"
  uo[1]: "LED1"
  uo[2]: "LED2"
  uo[3]: "LED3"
  uo[4]: "LED4"
  uo[5]: "LED5"
  uo[6]: "LED6"
  uo[7]: "LED7"

  # Bidirectional pins
  uio[0]: "spi_cs_n"
  uio[1]: "spi_mosi"
  uio[2]: "spi_miso"
  uio[3]: "spi_clk"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
