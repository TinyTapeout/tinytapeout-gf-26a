# Tiny Tapeout project information
project:
  title:        "Dyadic PWM"      # Project title
  author:       "Maksudjon Usmonov"      # Your name
  discord:      "maksud_89548"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Digital PWM generator with selectable width, dyadic and dithering modulation"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_maqsudbek_dyadic_pwm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "dyadic.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (run mode: control MSB / config write: data)
  ui[0]: "ctrl[4] / cfg_data[0]"
  ui[1]: "ctrl[5] / cfg_data[1]"
  ui[2]: "ctrl[6] / cfg_data[2]"
  ui[3]: "ctrl[7] / cfg_data[3]"
  ui[4]: "ctrl[8] / cfg_data[4]"
  ui[5]: "ctrl[9] / cfg_data[5]"
  ui[6]: "ctrl[10] / cfg_data[6]"
  ui[7]: "ctrl[11] / cfg_data[7]"

  # Outputs
  uo[0]: "pwm_high"
  uo[1]: "pwm_low"
  uo[2]: "sync_clk"
  uo[3]: "duty[4]"
  uo[4]: "duty[5]"
  uo[5]: "duty[6]"
  uo[6]: "duty[7]"
  uo[7]: "duty[8]"

  # Bidirectional pins (all inputs; run mode / config write)
  uio[0]: "ctrl[0] / -"
  uio[1]: "ctrl[1] / -"
  uio[2]: "ctrl[2] / -"
  uio[3]: "ctrl[3] / -"
  uio[4]: "cfg_addr[0]"
  uio[5]: "cfg_addr[1]"
  uio[6]: "cfg_addr[2]"
  uio[7]: "cfg_we (1=config write)"

# Do not change!
yaml_version: 6
