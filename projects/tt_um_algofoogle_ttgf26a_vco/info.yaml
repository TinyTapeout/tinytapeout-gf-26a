# Tiny Tapeout project information
project:
  title:        "VCO driven by DAC"      # Project title
  author:       "algofoogle (Anton Maurovic)"      # Your name
  discord:      "algofoogle"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Mixed-signal project with DAC setting a VCO's control voltage"      # One line description of what your project does
  language:     "Analog/Mixed" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_algofoogle_ttgf26a_vco"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "vco_in[1]"
  ui[1]: "vco_in[2]"
  ui[2]: "vco_in[3]"
  ui[3]: "vco_in[4]"
  ui[4]: "vco_in[5]"
  ui[5]: "vco_in[6]"
  ui[6]: "vco_in[7]"
  ui[7]: "vco_in[8]"

  # Outputs
  uo[0]: ""
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "vco_in[0]"
  uio[1]: ""
  uio[2]: "vco_out"
  uio[3]: "counter[0]"
  uio[4]: "counter[1]"
  uio[5]: "counter[2]"
  uio[6]: "counter[3]"
  uio[7]: "counter[4]"

# Do not change!
yaml_version: 6
