yaml_version: 6

# -----------------------------------------------------------------------------
# Tiny Tapeout project information
# -----------------------------------------------------------------------------
project:
  title:        "RRAM Characterization Platform (DC sweep + endurance + retention + histogram, GF180)"
  author:       "Prof. Santhosh Sivasubramani, IIT Delhi"
  discord:      ""
  description:  "GF180mcuD standalone characterization platform for one external resistive-switching device (RRAM / memristor / PCM). Drives an 8-bit DAC rail and reads back an 8-bit ADC rail, with four SPI-selectable modes: DC sweep (VSTART..VSTOP by VSTEP with on-chip 16-bin histogram and min/max tracking), pulse endurance (N cycles of SET/read-verify/RESET/read-verify with THR_LO / THR_HI checks, latches FAIL_IDX on first miss), retention (SET pulse then periodic reads at programmable interval), and free-running histogram capture. 25 MHz signoff clock."
  language:     "Verilog"
  clock_hz:     25000000

  tiles: "1x2"

  top_module:   "tt_um_santhosh_rsd_char_gf"

  source_files:
    - "project.v"
    - "spi_slave.v"

# -----------------------------------------------------------------------------
# Pinout
# -----------------------------------------------------------------------------
pinout:
  ui[0]: "adc_in[0] (external device readback, LSB)"
  ui[1]: "adc_in[1]"
  ui[2]: "adc_in[2]"
  ui[3]: "adc_in[3]"
  ui[4]: "adc_in[4]"
  ui[5]: "adc_in[5]"
  ui[6]: "adc_in[6]"
  ui[7]: "adc_in[7] (MSB)"

  uo[0]: "dac_out[0] (DAC drive to external device, LSB)"
  uo[1]: "dac_out[1]"
  uo[2]: "dac_out[2]"
  uo[3]: "dac_out[3]"
  uo[4]: "dac_out[4]"
  uo[5]: "dac_out[5]"
  uo[6]: "dac_out[6]"
  uo[7]: "dac_out[7] (MSB)"

  uio[0]: "spi_cs_n (in)"
  uio[1]: "spi_mosi (in)"
  uio[2]: "spi_miso (out)"
  uio[3]: "spi_sck  (in)"
  uio[4]: "busy (out)"
  uio[5]: "done_sticky (out)"
  uio[6]: "pass_fail (out, endurance)"
  uio[7]: "trigger_out (out, high during SET/RESET/sample phases)"
