
# Tiny Tapeout project information
project:
  title:        "DOTTEE VGA demo (TTGF26a)"
  author:       "algofoogle (Anton Maurovic)"
  discord:      "algofoogle"
  description:  "DOTTEE: Pretty little 1-tile Tiny Tapeout ASIC demo (TTGF26a version)"
  language:     Verilog
  clock_hz:     25_175_000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_algofoogle_dottee"
  
  source_files:
    - audio.v
    - gems.v
    - dottee_logo.v
    - circle_edge.v
    - project.v
    - hvsync_generator.v

# The pinout of your project. Leave unused pins blank.
# This section is for the datasheet/website.
pinout:
  # Inputs
  ui[0]: "debug[0]"
  ui[1]: "debug[1]"
  ui[2]: "debug[2]"
  ui[3]: "debug[3]"
  ui[4]: "debug[4]"
  ui[5]: "debug[5]"
  ui[6]: "debug[6]"
  ui[7]: "debug[7]"

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: "audio_out"

# Do not change!
yaml_version: 6
